name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    # The app targets iOS 26.0, which needs the Xcode 26 SDK (not on macos-15).
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      # Simulator names change with each Xcode release, so use whichever iPhone exists.
      - name: Pick simulator
        run: |
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "SIM_ID=$SIM_ID" >> "$GITHUB_ENV"

      - name: Generate Secrets.xcconfig
        run: |
          cat > Secrets.xcconfig <<EOF
          // Auto-generated for CI
          RAWG_API_KEY = ${{ secrets.RAWG_API_KEY || 'CI_PLACEHOLDER_KEY' }}
          EOF

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project Gameboxd.xcodeproj \
            -scheme Gameboxd \
            -destination "id=$SIM_ID" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY=NO \
            | xcpretty
          exit ${PIPESTATUS[0]}

      # The GameboxdTests target is hosted by the app, so the "Gameboxd" scheme runs it.
      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Gameboxd.xcodeproj \
            -scheme Gameboxd \
            -destination "id=$SIM_ID" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY=NO \
            | xcpretty
          exit ${PIPESTATUS[0]}

      - name: Upload Test Results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          retention-days: 7

  swiftlint:
    name: SwiftLint
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Lint
        run: swiftlint lint --reporter github-actions-logging
